<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>STOMP Interceptor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="header">
    <div class="title">
      <div class="icon">S</div>
      <span>STOMP Interceptor</span>
    </div>
    <span id="recordingStatus" class="status-pill">Idle</span>
  </div>

  <!-- Recording Controls -->
  <div class="section">
    <div class="section-title">Recorder</div>
    <div class="form-group" id="sessionNameGroup">
      <label for="sessionName">Session Name</label>
      <input type="text" id="sessionName" placeholder="e.g. User Chat Flow Test">
    </div>
    <button id="btnToggleRecord" class="btn btn-rec">● Start Recording</button>
  </div>

  <!-- Live Intercepted Stream Preview -->
  <div class="section">
    <div class="section-title" style="display:flex; justify-content:space-between;">
      <span>Intercepted Frames</span>
      <span id="frameCount" style="color:var(--accent-cyan);">0</span>
    </div>
    <div class="live-feed" id="liveFeed">
      <div style="color:var(--text-muted); text-align:center; padding:0.5rem;">Ready to record STOMP frames</div>
    </div>
  </div>

  <!-- Quick Replay Control -->
  <div class="section">
    <div class="section-title">Quick Replay</div>
    <div class="form-group">
      <label for="sessionSelect">Select Recorded Session</label>
      <select id="sessionSelect">
        <option value="">Loading sessions...</option>
      </select>
    </div>
    <div class="form-group">
      <label for="replayMode">Replay Strategy</label>
      <select id="replayMode">
        <option value="SERVER_MOCK">Mock Server -> Client (DevTools Protocol)</option>
        <option value="CLIENT">Re-send Client -> Server (WebSockets)</option>
      </select>
    </div>
    <button id="btnReplay" class="btn btn-primary">► Replay Session</button>
  </div>

  <!-- Footer Actions -->
  <div class="footer-actions">
    <button id="btnOpenDashboard" class="btn btn-secondary">Full Dashboard</button>
    <button id="btnExportJSON" class="btn btn-secondary">Export JSON</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
