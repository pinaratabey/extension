<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>STOMP Interceptor & Replay Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="../components/json-editor.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

  <div class="dashboard-layout">
    
    <!-- Sidebar: Recording Sessions -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Recorded Sessions</div>
        <button id="btnImport" class="btn btn-secondary" style="padding:0.3rem 0.6rem; font-size:0.75rem;">+ Import</button>
      </div>

      <div class="session-list" id="sessionList">
        <!-- Render sessions here -->
      </div>
    </div>

    <!-- Main View: STOMP Frame Feed -->
    <div class="main-view">
      <div class="top-bar">
        <div>
          <h2 id="currentSessionTitle" style="font-size:1.1rem;">Select a session</h2>
          <p id="currentSessionSubtitle" style="font-size:0.75rem; color:var(--text-muted);">Inspect recorded STOMP frames</p>
        </div>

        <div style="display:flex; gap:0.5rem; align-items:center;">
          <input type="text" id="frameSearch" class="search-input" placeholder="Filter by destination...">
          <button id="btnReplaySelected" class="btn btn-cyan" style="padding:0.5rem 0.8rem; font-size:0.8rem;" disabled>▶ Replay Selected</button>
          <button id="btnDeleteSession" class="btn btn-red" style="padding:0.5rem 0.8rem; font-size:0.8rem;">Delete</button>
        </div>
      </div>

      <div class="frame-table-container">
        <table>
          <thead>
            <tr>
              <th style="width:36px;"><input type="checkbox" id="selectAllFrames" title="Select all"></th>
              <th>#</th>
              <th>Time</th>
              <th>Dir</th>
              <th>Command</th>
              <th>Destination</th>
              <th>Size</th>
            </tr>
          </thead>
          <tbody id="frameTableBody">
            <!-- Render frames here -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Inspector Panel: Frame Detail -->
    <div class="inspector">
      <div class="inspector-title">Frame Inspector</div>

      <div id="inspectorContent">
        <div style="color:var(--text-muted); text-align:center; padding:2rem; font-size:0.85rem;">
          Select a frame from the table to inspect headers & payload
        </div>
      </div>
    </div>

  </div>

  <input type="file" id="importFileInput" accept=".json" style="display:none;">
  <script type="module" src="dashboard.js"></script>
</body>
</html>
